<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConvertDox OG Image Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #0F2A4A; padding: 24px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    .layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }

    /* Controls */
    .controls { flex: 0 0 280px; background: white; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 20px; }
    .controls h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; margin-top: 14px; }
    label:first-of-type { margin-top: 0; }
    input[type=text], input[type=number], textarea, select {
      width: 100%; padding: 8px 10px; border: 1.5px solid #e2e8f0; border-radius: 7px;
      font-family: inherit; font-size: 13px; outline: none; background: white;
    }
    input[type=color] { width: 100%; height: 34px; padding: 2px; border: 1.5px solid #e2e8f0; border-radius: 7px; cursor: pointer; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .divider { border: none; border-top: 1px solid #f1f5f9; margin: 18px 0; }
    .btn-download {
      width: 100%; margin-top: 18px; padding: 12px;
      background: #E85D04; color: white; border: none; border-radius: 9px;
      font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .btn-download:hover { background: #d05200; }
    .btn-secondary {
      width: 100%; margin-top: 8px; padding: 10px;
      background: white; color: #0F2A4A; border: 1.5px solid #e2e8f0; border-radius: 9px;
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .hint { font-size: 11.5px; color: #94a3b8; margin-top: 4px; }

    /* Preview */
    .preview-wrap { flex: 1; min-width: 300px; }
    .preview-wrap h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; margin-bottom: 10px; }
    canvas { border-radius: 10px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); max-width: 100%; height: auto; display: block; }
    .scale-hint { font-size: 11.5px; color: #94a3b8; margin-top: 8px; }

    /* Variants */
    .variants { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .variant-btn {
      padding: 6px 14px; border-radius: 6px; border: 1.5px solid #e2e8f0;
      background: white; font-size: 12px; font-weight: 600; cursor: pointer; color: #374151;
    }
    .variant-btn.active { background: #0F2A4A; color: white; border-color: #0F2A4A; }
  </style>
</head>
<body>

<h1>ConvertDox OG Image Generator</h1>
<p class="subtitle">Generates 1200×630px PNG for Open Graph, Twitter cards, and social sharing.</p>

<div class="layout">

  <!-- Controls -->
  <div class="controls">
    <h2>Content</h2>

    <label>Headline</label>
    <input type="text" id="headline" value="196+ Free Online Tools" oninput="render()">

    <label>Subheadline</label>
    <input type="text" id="subheadline" value="No Signup · Files Never Stored · 100% Free" oninput="render()">

    <label>Tag / Badge</label>
    <input type="text" id="badge" value="ConvertDox" oninput="render()">

    <label>Tool Icons (comma-separated)</label>
    <input type="text" id="icons" value="📄 PDF · 🖼️ Images · 🤖 AI · 🔢 Calculators · 💻 Dev" oninput="render()">

    <hr class="divider">
    <h2>Colors</h2>

    <div class="row2">
      <div>
        <label>Background</label>
        <input type="color" id="bgColor" value="#0F2A4A" oninput="render()">
      </div>
      <div>
        <label>Accent</label>
        <input type="color" id="accentColor" value="#E85D04" oninput="render()">
      </div>
    </div>
    <div class="row2">
      <div>
        <label>Headline</label>
        <input type="color" id="headlineColor" value="#FFFFFF" oninput="render()">
      </div>
      <div>
        <label>Sub text</label>
        <input type="color" id="subColor" value="#94a3b8" oninput="render()">
      </div>
    </div>

    <hr class="divider">
    <h2>Preset Variants</h2>
    <div class="variants">
      <button class="variant-btn active" onclick="applyVariant('main',this)">Main</button>
      <button class="variant-btn" onclick="applyVariant('light',this)">Light</button>
      <button class="variant-btn" onclick="applyVariant('orange',this)">Orange</button>
      <button class="variant-btn" onclick="applyVariant('blog',this)">Blog</button>
    </div>

    <button class="btn-download" onclick="download()">⬇ Download PNG (1200×630)</button>
    <button class="btn-secondary" onclick="copyDataUrl()">📋 Copy data URL</button>
    <p class="hint">Opens at full 1200×630 resolution.</p>
  </div>

  <!-- Preview -->
  <div class="preview-wrap">
    <h2>Preview (scaled)</h2>
    <canvas id="canvas" width="1200" height="630"></canvas>
    <p class="scale-hint">Preview is scaled to fit. Downloaded PNG is full 1200×630.</p>
  </div>

</div>

<script>
  // ── Variant definitions ─────────────────────────────────────────────────────
  const VARIANTS = {
    main: {
      bgColor: '#0F2A4A', accentColor: '#E85D04', headlineColor: '#FFFFFF', subColor: '#94a3b8',
      headline: '196+ Free Online Tools', subheadline: 'No Signup · Files Never Stored · 100% Free',
      badge: 'ConvertDox', icons: '📄 PDF · 🖼️ Images · 🤖 AI · 🔢 Calculators · 💻 Dev'
    },
    light: {
      bgColor: '#FFFFFF', accentColor: '#E85D04', headlineColor: '#0F2A4A', subColor: '#64748b',
      headline: '196+ Free Online Tools', subheadline: 'No Signup · Files Never Stored · 100% Free',
      badge: 'ConvertDox', icons: '📄 PDF · 🖼️ Images · 🤖 AI · 🔢 Calculators · 💻 Dev'
    },
    orange: {
      bgColor: '#E85D04', accentColor: '#FFFFFF', headlineColor: '#FFFFFF', subColor: 'rgba(255,255,255,0.8)',
      headline: '196+ Free Online Tools', subheadline: 'Every tool you need, in one place.',
      badge: 'ConvertDox', icons: '📄 PDF · 🖼️ Images · 🤖 AI · 🔢 Calculators · 💻 Dev'
    },
    blog: {
      bgColor: '#0F2A4A', accentColor: '#F48C42', headlineColor: '#FFFFFF', subColor: 'rgba(255,255,255,0.65)',
      headline: 'ConvertDox Blog', subheadline: 'Tutorials, Guides & Tips',
      badge: 'Blog', icons: '✍️ Guides · 📚 Tutorials · 💡 Tips'
    },
  }

  function applyVariant(name, btn) {
    const v = VARIANTS[name]
    if (!v) return
    document.getElementById('bgColor').value = v.bgColor
    document.getElementById('accentColor').value = v.accentColor
    document.getElementById('headlineColor').value = v.headlineColor
    document.getElementById('subColor').value = v.subColor
    document.getElementById('headline').value = v.headline
    document.getElementById('subheadline').value = v.subheadline
    document.getElementById('badge').value = v.badge
    document.getElementById('icons').value = v.icons
    document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    render()
  }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16)
    return { r, g, b }
  }
  function lighten(hex, amt) {
    const { r, g, b } = hexToRgb(hex)
    return `rgba(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)},1)`
  }
  function alpha(hex, a) {
    const { r, g, b } = hexToRgb(hex)
    return `rgba(${r},${g},${b},${a})`
  }

  // ── Render ───────────────────────────────────────────────────────────────────
  function render() {
    const canvas = document.getElementById('canvas')
    const ctx = canvas.getContext('2d')
    const W = 1200, H = 630

    const bg      = document.getElementById('bgColor').value
    const accent  = document.getElementById('accentColor').value
    const hlColor = document.getElementById('headlineColor').value
    const subCol  = document.getElementById('subColor').value
    const headline    = document.getElementById('headline').value
    const subheadline = document.getElementById('subheadline').value
    const badge       = document.getElementById('badge').value
    const icons       = document.getElementById('icons').value
    const isLight     = bg.toLowerCase() === '#ffffff' || bg.toLowerCase() === '#fff'

    ctx.clearRect(0, 0, W, H)

    // Background
    ctx.fillStyle = bg
    ctx.fillRect(0, 0, W, H)

    // Subtle radial gradient overlay (decorative)
    const grad = ctx.createRadialGradient(W * 0.75, H * 0.2, 80, W * 0.75, H * 0.2, 500)
    grad.addColorStop(0, alpha(accent, 0.18))
    grad.addColorStop(1, alpha(accent, 0))
    ctx.fillStyle = grad
    ctx.fillRect(0, 0, W, H)

    // Decorative circle (bottom-left)
    ctx.beginPath()
    ctx.arc(-60, H + 60, 280, 0, Math.PI * 2)
    ctx.fillStyle = alpha(accent, 0.08)
    ctx.fill()

    // Decorative circle (top-right)
    ctx.beginPath()
    ctx.arc(W + 80, -80, 300, 0, Math.PI * 2)
    ctx.fillStyle = alpha(accent, 0.07)
    ctx.fill()

    // ── Logo icon area ─────────────────────────────────────────────────────────
    const iconX = 80, iconY = 72, iconS = 64
    // Icon background
    ctx.fillStyle = alpha(accent, 0.15)
    roundRect(ctx, iconX, iconY, iconS, iconS, 14)
    ctx.fill()
    // Simple two-rectangle logo
    ctx.fillStyle = hlColor
    ctx.globalAlpha = 0.9
    ctx.fillRect(iconX + 10, iconY + 14, 17, 22)
    ctx.globalAlpha = 1
    ctx.fillStyle = accent
    ctx.fillRect(iconX + 33, iconY + 22, 17, 22)
    // Arrow
    ctx.fillStyle = hlColor
    ctx.globalAlpha = 0.9
    ctx.beginPath()
    ctx.moveTo(iconX + 29, iconY + 27); ctx.lineTo(iconX + 33, iconY + 31); ctx.lineTo(iconX + 29, iconY + 35)
    ctx.fill()
    ctx.globalAlpha = 1

    // ── Brand name ─────────────────────────────────────────────────────────────
    ctx.font = 'bold 38px -apple-system, BlinkMacSystemFont, Arial, sans-serif'
    ctx.fillStyle = hlColor
    ctx.fillText('Convert', iconX + iconS + 18, iconY + 44)
    const measureConvert = ctx.measureText('Convert')
    ctx.fillStyle = accent
    ctx.fillText('Dox', iconX + iconS + 18 + measureConvert.width, iconY + 44)

    // ── Badge / tag ────────────────────────────────────────────────────────────
    if (badge) {
      const badgeText = badge.toUpperCase()
      ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, Arial, sans-serif'
      const bw = ctx.measureText(badgeText).width + 32
      const bx = 80, by = 220, bh = 40
      ctx.fillStyle = alpha(accent, 0.2)
      roundRect(ctx, bx, by, bw, bh, 8)
      ctx.fill()
      ctx.fillStyle = accent
      ctx.font = 'bold 17px -apple-system, BlinkMacSystemFont, Arial, sans-serif'
      ctx.textBaseline = 'middle'
      ctx.fillText(badgeText, bx + 16, by + bh / 2)
      ctx.textBaseline = 'alphabetic'
    }

    // ── Headline ───────────────────────────────────────────────────────────────
    ctx.fillStyle = hlColor
    ctx.font = `bold ${headline.length > 28 ? 68 : 78}px -apple-system, BlinkMacSystemFont, Arial, sans-serif`
    ctx.letterSpacing = '-2px'

    const words = headline.split(' ')
    const maxWidth = 880
    let line1 = '', line2 = ''
    let testLine = ''
    let splitDone = false
    for (let i = 0; i < words.length; i++) {
      testLine += (testLine ? ' ' : '') + words[i]
      if (!splitDone && ctx.measureText(testLine).width > maxWidth) {
        line1 = testLine.replace(new RegExp(' ?' + words[i] + '$'), '').trim()
        line2 = words.slice(i).join(' ')
        splitDone = true; break
      }
    }
    if (!splitDone) line1 = headline

    const hlY = badge ? 320 : 290
    ctx.fillText(line1, 80, hlY)
    if (line2) ctx.fillText(line2, 80, hlY + 90)

    ctx.letterSpacing = '0px'

    // ── Subheadline ────────────────────────────────────────────────────────────
    const subY = hlY + (line2 ? 160 : 70)
    ctx.fillStyle = subCol
    ctx.font = '26px -apple-system, BlinkMacSystemFont, Arial, sans-serif'
    ctx.fillText(subheadline, 80, subY)

    // ── Icons row ─────────────────────────────────────────────────────────────
    if (icons) {
      const iconRowY = H - 72
      // Pill background
      ctx.fillStyle = alpha(hlColor === '#FFFFFF' ? '#000000' : '#FFFFFF', 0.07)
      roundRect(ctx, 80, iconRowY - 28, W - 160, 52, 12)
      ctx.fill()

      ctx.font = '22px -apple-system, BlinkMacSystemFont, Arial, sans-serif'
      ctx.fillStyle = alpha(hlColor, 0.7)
      ctx.textBaseline = 'middle'
      ctx.fillText(icons, 100, iconRowY)
      ctx.textBaseline = 'alphabetic'
    }

    // ── Right-side decorative number ──────────────────────────────────────────
    const numMatch = headline.match(/\d+\+?/)
    if (numMatch && numMatch[0] !== headline) {
      ctx.save()
      ctx.globalAlpha = 0.04
      ctx.font = `bold 320px -apple-system, BlinkMacSystemFont, Arial, sans-serif`
      ctx.fillStyle = accent
      ctx.textAlign = 'right'
      ctx.fillText(numMatch[0], W - 40, H - 20)
      ctx.restore()
    }

    // ── Bottom accent line ────────────────────────────────────────────────────
    ctx.fillStyle = accent
    ctx.fillRect(0, H - 5, W, 5)
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath()
    ctx.moveTo(x + r, y)
    ctx.lineTo(x + w - r, y)
    ctx.quadraticCurveTo(x + w, y, x + w, y + r)
    ctx.lineTo(x + w, y + h - r)
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h)
    ctx.lineTo(x + r, y + h)
    ctx.quadraticCurveTo(x, y + h, x, y + h - r)
    ctx.lineTo(x, y + r)
    ctx.quadraticCurveTo(x, y, x + r, y)
    ctx.closePath()
  }

  // ── Download ──────────────────────────────────────────────────────────────
  function download() {
    const canvas = document.getElementById('canvas')
    const a = document.createElement('a')
    a.download = 'og-image.png'
    a.href = canvas.toDataURL('image/png')
    a.click()
  }

  function copyDataUrl() {
    const canvas = document.getElementById('canvas')
    const url = canvas.toDataURL('image/png')
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.querySelector('.btn-secondary')
      btn.textContent = '✅ Copied!'
      setTimeout(() => { btn.textContent = '📋 Copy data URL' }, 2000)
    })
  }

  // Initial render
  render()
</script>

</body>
</html>
